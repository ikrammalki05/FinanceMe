name: finance_manager

description: Application de Gestion Financière Personnelle - Mini Projet Flutter 2025/2026

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # UI & Charts
  fl_chart: ^0.66.1
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0

  # Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/